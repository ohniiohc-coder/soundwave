# 프로덕션 시크릿 템플릿 - 실제 값은 AWS Secrets Manager 또는 kubectl create secret으로 관리
# kubectl create secret generic music-streaming-secrets \
#   --namespace music-streaming \
#   --from-literal=DATABASE_URL="postgresql+asyncpg://user:pass@rds-endpoint:5432/musicdb" \
#   --from-literal=S3_ACCESS_KEY="YOUR_AWS_ACCESS_KEY" \
#   --from-literal=S3_SECRET_KEY="YOUR_AWS_SECRET_KEY" \
#   --from-literal=ADMIN_API_KEY="your-secure-admin-key" \
#   --from-literal=AIRFLOW_PASSWORD="your-airflow-password"
apiVersion: v1
kind: Secret
metadata:
  name: music-streaming-secrets
  namespace: music-streaming
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  ADMIN_API_KEY: "REPLACE_ME"
  AIRFLOW_PASSWORD: "REPLACE_ME"
  AIRFLOW_FERNET_KEY: "REPLACE_ME"
